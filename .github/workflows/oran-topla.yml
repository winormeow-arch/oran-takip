name: Oran topla

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oran-topla
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bulteni cek
        run: node topla.js

      - name: Depoya yaz
        run: |
          git config user.name  "oran-bot"
          git config user.email "oran-bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Degisiklik yok"
            exit 0
          fi
          git commit -m "oran: $(TZ=Europe/Istanbul date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
