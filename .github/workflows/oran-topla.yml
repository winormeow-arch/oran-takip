name: Oran topla

on:
  schedule:
    - cron: '*/30 * * * *'      # yarım saatte bir tetiklenmeye çalışır
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oran-topla
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Git kimligi
        run: |
          git config user.name  "oran-bot"
          git config user.email "oran-bot@users.noreply.github.com"

      - name: Ornekleri topla
        env:
          TUR: '11'        # kac ornek alinsin
          ARA: '300'       # ornekler arasi saniye (300 = 5 dakika)
          GIT_YAZ: '1'
        run: node topla.js
